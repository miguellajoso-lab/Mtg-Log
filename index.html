<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F3EEE0;
    --bg-alt: #E9E1CB;
    --ink: #1C2431;
    --ink-soft: #565B66;
    --ink-faint: #8B8A7E;
    --primary: #1F3B5C;
    --primary-soft: #6C86A3;
    --gold: #B9924A;
    --win: #33684E;
    --win-bg: #E1EBE3;
    --loss: #93413B;
    --loss-bg: #F1E1DE;
    --draw: #756F5E;
    --draw-bg: #E9E4D6;
    --card: #FBF8EF;
    --line: #D8CFB4;
    --radius: 3px;
    --shadow: 0 1px 0 rgba(28,36,49,0.05);
    --bg-dots: rgba(28,36,49,0.05);
    --input-bg: #FFFFFF;
    font-size: 16px;
  }
  html[data-theme="dark"]{
    --bg: #171B22;
    --bg-alt: #1F2530;
    --ink: #ECE6D6;
    --ink-soft: #A8ADBB;
    --ink-faint: #6B7280;
    --primary: #7FA2CC;
    --primary-soft: #4C6A8C;
    --gold: #D4AD63;
    --win: #6FBE93;
    --win-bg: #1E332A;
    --loss: #E08579;
    --loss-bg: #3A2422;
    --draw: #A6A08D;
    --draw-bg: #2A2A24;
    --card: #1D222B;
    --line: #313846;
    --shadow: 0 1px 0 rgba(0,0,0,0.2);
    --bg-dots: rgba(255,255,255,0.045);
    --input-bg: #10141B;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}
  html{transition: background-color .2s ease;}
  body{
    margin:0;
    background: var(--bg);
    background-image: radial-gradient(circle at 1px 1px, var(--bg-dots) 1px, transparent 0);
    background-size: 14px 14px;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    display:flex;
    justify-content:center;
    transition: background-color .2s ease, color .2s ease;
  }
  #shell{
    width:100%;
    max-width:480px;
    min-height:100vh;
    background: var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
  }
  header.topbar{
    padding: 16px 18px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
    position:sticky; top:0; z-index:5;
  }
  header.topbar .brand-row{display:flex; align-items:center; gap:10px;}
  header.topbar .logo-mark{
    width:38px; height:38px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:#0A0A0A;
    border-radius: 8px;
    overflow:hidden;
    border:1px solid var(--line);
  }
  header.topbar .logo-mark img{width:100%; height:100%; object-fit:cover; display:block;}
  header.topbar .brand{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 1.32rem;
    letter-spacing: -0.01em;
    line-height:1.1;
  }
  header.topbar .brand .dot{color:var(--gold);}
  header.topbar .sub{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.64rem;
    color: var(--ink-faint);
    text-transform:uppercase;
    letter-spacing:0.06em;
  }
  header.topbar .head-actions{display:flex; align-items:center; gap:4px;}
  .icon-btn{
    background:none;
    width:34px; height:34px;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    color: var(--ink-soft);
    flex-shrink:0;
  }
  .icon-btn svg{width:18px; height:18px;}
  .icon-btn:active{background: var(--bg-alt);}
  main{
    flex:1;
    padding: 16px 16px 96px;
    overflow-y:auto;
  }
  h2.section-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.05rem;
    margin: 4px 2px 12px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  h2.section-title .num{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.7rem;
    color: var(--gold);
    border:1px solid var(--gold);
    border-radius:50%;
    width:20px; height:20px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .card{
    background: var(--card);
    border:1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding:16px;
    margin-bottom:14px;
  }
  .stat-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:10px;
  }
  .stat-box{
    background: var(--card);
    border:1px solid var(--line);
    border-radius: var(--radius);
    padding:14px 12px;
    text-align:left;
  }
  .stat-box .label{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.62rem;
    text-transform:uppercase;
    letter-spacing:0.07em;
    color: var(--ink-faint);
    margin-bottom:6px;
  }
  .stat-box .value{
    font-family:'Fraunces', serif;
    font-size:1.9rem;
    font-weight:600;
    color: var(--primary);
    line-height:1;
  }
  .stat-box .value.win{color:var(--win);}
  .stat-box .sub{
    font-size:0.72rem;
    color: var(--ink-soft);
    margin-top:4px;
  }
  table.ledger{
    width:100%;
    border-collapse:collapse;
    font-size:0.85rem;
  }
  table.ledger th{
    text-align:left;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.62rem;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--ink-faint);
    border-bottom:1px solid var(--line);
    padding:4px 6px 8px 0;
  }
  table.ledger td{
    padding:8px 6px 8px 0;
    border-bottom: 1px dashed var(--line);
    vertical-align:middle;
  }
  table.ledger tr:last-child td{border-bottom:none;}
  .pct-bar{
    height:5px;
    background: var(--bg-alt);
    border-radius:3px;
    overflow:hidden;
    margin-top:4px;
    width:100%;
  }
  .pct-bar > div{height:100%; background: var(--primary);}
  .badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:0.68rem;
    width:22px; height:22px;
    border-radius:50%;
    color:#fff;
    flex-shrink:0;
  }
  .badge.W{background:var(--win);}
  .badge.L{background:var(--loss);}
  .badge.D{background:var(--draw);}
  .empty{
    text-align:center;
    padding: 30px 16px;
    color: var(--ink-faint);
    font-size:0.88rem;
  }
  .empty .glyph{font-size:1.8rem; display:block; margin-bottom:8px;}
  button{
    font-family:'Inter', sans-serif;
    cursor:pointer;
    border:none;
  }
  .btn-primary{
    width:100%;
    background: var(--primary);
    color:#fff;
    padding:13px;
    border-radius: var(--radius);
    font-weight:600;
    font-size:0.92rem;
    letter-spacing:0.01em;
  }
  .btn-primary:active{background:#16283e;}
  .btn-secondary{
    background: transparent;
    color: var(--primary);
    border:1px solid var(--primary-soft);
    padding:10px 14px;
    border-radius: var(--radius);
    font-weight:600;
    font-size:0.85rem;
  }
  .btn-danger{
    background:transparent;
    color: var(--loss);
    border:1px solid var(--loss);
    padding:9px 12px;
    border-radius:var(--radius);
    font-size:0.8rem;
    font-weight:600;
  }
  .btn-ghost{
    background:transparent;
    color:var(--ink-soft);
    padding:8px 10px;
    font-size:0.8rem;
    text-decoration:underline;
    text-underline-offset:2px;
  }
  .btn-small{
    background: var(--bg-alt);
    color: var(--primary);
    padding:8px 12px;
    border-radius: var(--radius);
    font-size:0.78rem;
    font-weight:600;
  }
  input, select, textarea{
    width:100%;
    font-family:'Inter', sans-serif;
    font-size:0.92rem;
    padding:11px 12px;
    border:1px solid var(--line);
    border-radius: var(--radius);
    background: var(--input-bg);
    color: var(--ink);
  }
  input::placeholder, textarea::placeholder{ color: var(--ink-faint); opacity:1; }
  select{ color: var(--ink); }
  textarea{font-family:'IBM Plex Mono', monospace; font-size:0.82rem; line-height:1.5;}
  input:focus, select:focus, textarea:focus{
    outline:2px solid var(--primary-soft);
    outline-offset:1px;
  }
  label{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.65rem;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color: var(--ink-faint);
    margin: 12px 0 6px;
  }
  label:first-child{margin-top:0;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .row3{display:grid; grid-template-columns:0.6fr 1fr 1fr; gap:8px;}
  .row3-eq{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}
  .seg{
    display:flex;
    border:1px solid var(--line);
    border-radius: var(--radius);
    overflow:hidden;
  }
  .seg button{
    flex:1;
    padding:10px 0;
    background:#fff;
    font-weight:600;
    font-size:0.85rem;
    color:var(--ink-soft);
    border-right:1px solid var(--line);
  }
  .seg button:last-child{border-right:none;}
  .seg button.active.W{background:var(--win-bg); color:var(--win);}
  .seg button.active.L{background:var(--loss-bg); color:var(--loss);}
  .seg button.active.D{background:var(--draw-bg); color:var(--draw);}

  .ticket{
    background: var(--card);
    border:1px solid var(--line);
    border-radius: var(--radius);
    position:relative;
    padding:18px 16px 16px;
    margin-bottom:16px;
  }
  .ticket::after{
    content:"";
    position:absolute;
    left:14px; right:14px; bottom:0;
    border-bottom:1px dashed var(--line);
  }
  .ticket .stamp{
    position:absolute;
    top:14px; right:14px;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.62rem;
    letter-spacing:0.08em;
    color:var(--gold);
    border:1px solid var(--gold);
    border-radius:20px;
    padding:3px 9px;
    transform: rotate(3deg);
  }
  .ticket .store{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.15rem;
    margin-bottom:2px;
    padding-right:70px;
  }
  .ticket .meta{
    font-size:0.78rem;
    color: var(--ink-soft);
  }
  .ticket .record{
    margin-top:14px;
    display:flex;
    gap:16px;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.78rem;
  }
  .round-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 10px;
    margin:0 -10px;
    border-bottom:1px dashed var(--line);
    border-left:3px solid transparent;
    border-radius:2px;
  }
  .round-row.W{border-left-color:var(--win); background: color-mix(in srgb, var(--win-bg) 55%, transparent);}
  .round-row.L{border-left-color:var(--loss); background: color-mix(in srgb, var(--loss-bg) 55%, transparent);}
  .round-row.D{border-left-color:var(--draw); background: color-mix(in srgb, var(--draw-bg) 55%, transparent);}
  .round-row:last-child{border-bottom:none;}
  .round-row .rn{
    font-family:'IBM Plex Mono', monospace;
    color:var(--ink-faint);
    font-size:0.72rem;
    width:22px;
    flex-shrink:0;
  }
  .round-row .opp{flex:1; font-size:0.88rem; min-width:0;}
  .round-row .score{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    color:var(--ink-faint);
  }
  .tabbar{
    position:fixed;
    bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:480px;
    background: var(--card);
    border-top:1px solid var(--line);
    display:flex;
    padding: 6px 2px calc(6px + env(safe-area-inset-bottom));
    z-index:10;
  }
  .tabbar button{
    flex:1;
    background:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    padding:8px 1px 4px;
    color: var(--ink-faint);
    font-size:0.56rem;
    font-family:'IBM Plex Mono', monospace;
    text-transform:uppercase;
    letter-spacing:0.02em;
    border-radius:var(--radius);
  }
  .tabbar button .ic{font-size:1.1rem; display:flex; align-items:center; justify-content:center;}
  .tabbar button .ic svg{width:19px; height:19px;}
  .tabbar button.active{color:var(--primary);}
  .tabbar button.active .ic{color:var(--gold);}

  .fab{
    position:fixed;
    right:calc(50% - 240px + 18px);
    bottom:calc(70px + env(safe-area-inset-bottom));
    width:54px; height:54px;
    border-radius:50%;
    background: var(--primary);
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 6px 16px rgba(0,0,0,0.22);
    z-index:8;
  }
  .fab svg{width:24px; height:24px;}
  .fab:active{transform:scale(0.94);}
  @media (max-width:480px){
    .fab{ right: 18px; }
  }

  .toast{
    position:fixed;
    left:50%; bottom:calc(78px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(8px);
    background: var(--ink);
    color: var(--bg);
    padding:10px 18px;
    border-radius:20px;
    font-size:0.82rem;
    font-weight:600;
    display:flex; align-items:center; gap:8px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.25);
    z-index:30;
    opacity:0;
    pointer-events:none;
    transition: opacity .18s ease, transform .18s ease;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }
  .toast svg{width:15px; height:15px; color: var(--win); flex-shrink:0;}
  .modal-bg{
    position:fixed; inset:0; background:rgba(28,36,49,0.45);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:20;
  }
  .modal{
    width:100%; max-width:480px;
    background: var(--bg);
    border-radius: 14px 14px 0 0;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    max-height:88vh;
    overflow-y:auto;
    animation: slideup .18s ease-out;
    position:relative;
  }
  @keyframes slideup{from{transform:translateY(24px); opacity:0.6} to{transform:translateY(0); opacity:1}}
  .modal h3{
    font-family:'Fraunces', serif;
    font-size:1.15rem;
    margin: 0 0 14px;
    font-weight:600;
    padding-right:24px;
  }
  .modal-actions{display:flex; gap:10px; margin-top:18px;}
  .modal-actions .btn-secondary{flex:1;}
  .modal-actions .btn-primary{flex:1;}
  .close-x{
    position:absolute; top:14px; right:16px;
    background:none; color:var(--ink-faint); font-size:1.1rem;
  }
  .list-item{
    display:flex; align-items:flex-start; justify-content:space-between;
    gap:10px; padding:12px 0; border-bottom:1px dashed var(--line);
  }
  .list-item:last-child{border-bottom:none;}
  .list-item .name{font-weight:600; font-size:0.9rem;}
  .list-item .tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.65rem; color:var(--ink-faint); margin-top:2px;
  }
  .del-x{color:var(--loss); font-size:0.72rem; background:none; text-decoration:underline; flex-shrink:0;}
  .fine{font-size:0.72rem; color:var(--ink-faint); margin-top:2px;}
  .deck-card{
    background: var(--card);
    border:1px solid var(--line);
    border-radius: var(--radius);
    padding:14px 16px;
    margin-bottom:12px;
  }
  .deck-card .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .deck-card .dname{font-family:'Fraunces', serif; font-weight:600; font-size:1.05rem;}
  .deck-card .dmeta{font-size:0.74rem; color:var(--ink-faint); margin-top:2px; font-family:'IBM Plex Mono', monospace;}
  .deck-card .actions{display:flex; gap:8px; margin-top:10px;}
  .deck-list-view{
    white-space:pre-wrap;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.78rem;
    background: var(--bg-alt);
    border-radius: var(--radius);
    padding:10px 12px;
    margin-top:8px;
    max-height:140px;
    overflow-y:auto;
    color: var(--ink-soft);
  }
  .toggle-list{font-size:0.72rem; color:var(--primary-soft); text-decoration:underline; background:none; margin-top:8px;}
  .deck-pill{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.68rem;
    background: var(--bg-alt);
    border-radius: 20px;
    padding:5px 11px;
    margin-bottom:2px;
  }
  .change-row{
    display:flex; align-items:center; gap:8px;
    background: var(--bg-alt);
    border-radius: var(--radius);
    padding:8px 10px;
    margin-bottom:6px;
    font-size:0.82rem;
  }
  .change-row .qtytag{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600; color:var(--primary); flex-shrink:0;
  }
  .change-row .arrow{color:var(--ink-faint); flex-shrink:0;}
  .change-row .out{color:var(--loss); flex:1; min-width:0;}
  .change-row .in{color:var(--win); flex:1; min-width:0;}
  .change-row .rm{background:none; color:var(--ink-faint); font-size:0.9rem; flex-shrink:0;}
  .changes-add-grid{display:grid; grid-template-columns:0.5fr 1fr 1fr auto; gap:6px; align-items:center;}
  .changes-add-grid input{padding:9px 8px; font-size:0.8rem;}
  .changes-add-grid button{
    background:var(--primary); color:#fff; border-radius:var(--radius);
    width:34px; height:34px; font-size:1.1rem; flex-shrink:0;
  }
  .deck-select-view{
    background: var(--bg-alt);
    border-radius: var(--radius);
    padding:10px 12px;
    margin-bottom:4px;
    font-size:0.82rem;
  }
  .archetype-block{margin-bottom:20px;}
  .archetype-block .aname{
    font-family:'Fraunces', serif; font-weight:600; font-size:0.95rem;
    margin-bottom:8px; display:flex; align-items:center; gap:8px;
  }
  .archetype-block .aname .arec{
    font-family:'IBM Plex Mono', monospace; font-size:0.68rem; color:var(--ink-faint); font-weight:400;
  }
  .ring-wrap{display:flex; align-items:center; gap:12px;}
  .ring-wrap svg{flex-shrink:0;}
  .ring-wrap .ring-num{display:flex; flex-direction:column;}
  .onboard-card{
    background: var(--card);
    border:1px solid var(--line);
    border-radius: 10px;
    padding:28px 22px;
    text-align:center;
    margin-bottom:16px;
  }
  .onboard-card .icon-circle{
    width:56px; height:56px; border-radius:50%;
    background: var(--bg-alt);
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 14px;
    color: var(--primary);
  }
  .onboard-card .icon-circle svg{width:26px; height:26px;}
  .onboard-card h3{
    font-family:'Fraunces', serif; font-weight:600; font-size:1.15rem; margin:0 0 6px;
  }
  .onboard-card p{
    font-size:0.85rem; color:var(--ink-soft); margin:0 0 18px; line-height:1.5;
  }
  .about-row{
    display:flex; align-items:center; gap:10px;
    padding:10px 0; border-bottom:1px dashed var(--line); font-size:0.85rem;
  }
  .about-row:last-child{border-bottom:none;}
  .about-row .k{color:var(--ink-faint); flex:1;}
  .theme-seg-icon svg{width:15px; height:15px;}
  .ico{width:1em; height:1em; display:inline-block; vertical-align:-0.14em; flex-shrink:0;}
  .nav-row{
    width:100%; background:none;
    display:flex; align-items:center; justify-content:space-between;
    padding:13px 2px; border-bottom:1px dashed var(--line); text-align:left;
  }
  .nav-row:last-child{border-bottom:none;}
  .nav-row:active{background: var(--bg-alt);}
  .nav-row .nr-title{font-weight:600; font-size:0.92rem; color:var(--ink);}
  .nav-row .nr-sub{font-size:0.7rem; color:var(--ink-faint); font-family:'IBM Plex Mono',monospace; margin-top:2px;}
  .nav-row .chev{color:var(--ink-faint); flex-shrink:0; font-size:1.3rem; line-height:1;}

  /* ============ VERSÃO DESKTOP (ecrãs largos, ex. Chrome em computador) ============ */
  @media (min-width: 880px){
    body{ background-size: 20px 20px; align-items:flex-start; }
    #shell{
      max-width: 1100px;
      display:grid;
      grid-template-columns: 220px 1fr;
      grid-template-rows: auto 1fr;
      min-height:100vh;
    }
    header.topbar{ grid-column: 1 / 3; grid-row: 1; padding: 20px 32px 16px; }
    header.topbar .brand{ font-size:1.5rem; }
    main{
      grid-column: 2; grid-row: 2;
      padding: 28px 40px 48px;
      max-width: 780px;
    }
    .card, .ticket, .deck-card, .onboard-card{ max-width:100%; }
    .stat-grid{ grid-template-columns: 1fr 1fr; gap:16px; }

    .tabbar{
      grid-column: 1; grid-row: 2;
      position:static;
      transform:none;
      width:auto; max-width:none;
      height:100%;
      flex-direction:column;
      align-items:stretch;
      justify-content:flex-start;
      background:transparent;
      border-top:none;
      border-right:1px solid var(--line);
      padding: 22px 14px;
      gap:2px;
    }
    .tabbar button{
      flex-direction:row;
      justify-content:flex-start;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      border-radius:8px;
      font-size:0.8rem;
      text-transform:none;
      letter-spacing:normal;
      cursor:pointer;
    }
    .tabbar button:hover{ background: var(--bg-alt); }
    .tabbar button .ic{font-size:1rem;}
    .tabbar button .ic svg{width:17px; height:17px;}

    .fab{ display:none; }

    button, .btn-primary, .btn-secondary, .btn-danger, .btn-small, .icon-btn, .nav-row, .deck-card .actions button{ cursor:pointer; }
    .btn-primary:hover{ background:#16283e; }
    html[data-theme="dark"] .btn-primary:hover{ background:#a9c4e8; }
    .btn-secondary:hover, .btn-danger:hover{ background: var(--bg-alt); }
    .deck-card:hover, .nav-row:hover{ border-color: var(--primary-soft); }

    .modal-bg{ align-items:center; }
    .modal{
      max-width:460px;
      border-radius:14px;
      max-height:85vh;
    }

    .toast{ left: calc(220px + (100% - 220px)/2); }
  }

  /* ============ folha de exportação do guia de sideboard (impressão/PDF) ============ */
  #sb-export-sheet{ display:none; }
  @media print{
    body *{ visibility:hidden; }
    #sb-export-sheet, #sb-export-sheet *{ visibility:visible; }
    #sb-export-sheet{
      display:block;
      position:absolute; top:0; left:0; width:100%;
      background:#fff; color:#111;
      font-family: Georgia, 'Times New Roman', serif;
      padding:0;
    }
    .exp-header{ margin-bottom:22px; border-bottom:2px solid #111; padding-bottom:12px; }
    .exp-title{ font-size:22pt; font-weight:700; }
    .exp-sub{ font-size:12pt; margin-top:2px; }
    .exp-date{ font-size:9pt; color:#555; margin-top:4px; font-family: 'Courier New', monospace; }
    .exp-arch{ margin-bottom:20px; page-break-inside:avoid; }
    .exp-arch-title{ font-size:14pt; font-weight:700; border-bottom:1px solid #999; padding-bottom:4px; margin-bottom:8px; }
    .exp-arch-count{ font-size:9pt; font-weight:400; color:#555; font-family:'Courier New', monospace; margin-left:8px; }
    .exp-cols{ display:flex; gap:28px; }
    .exp-col{ flex:1; }
    .exp-col-title{ font-size:10pt; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:6px; }
    .exp-col-out .exp-col-title{ color:#7a2a24; }
    .exp-col-in .exp-col-title{ color:#1f5c3f; }
    .exp-col ul{ list-style:none; margin:0; padding:0; }
    .exp-col li{ font-size:11pt; padding:3px 0; border-bottom:1px dotted #ccc; }
    .exp-qty{ font-family:'Courier New', monospace; font-weight:700; margin-right:6px; }
    .exp-empty{ font-size:10pt; color:#888; font-style:italic; }
    @page{ margin:18mm; }
  }
</style>
</head>
<body>
<div id="shell">
  <header class="topbar">

/* ---------- persistência (usa window.storage dentro do Claude; localStorage fora dele) ---------- */
const hasClaudeStorage = (typeof window.storage !== 'undefined') && window.storage && typeof window.storage.get === 'function';
async function storageGet(key){
  if(hasClaudeStorage){
    try{ return await window.storage.get(key); }
    catch(e){ /* cai para localStorage abaixo */ }
  }
  try{
    const v = localStorage.getItem('mtglog:'+key);
    return v!==null ? {key, value:v} : null;
  }catch(e){ return null; }
}
async function storageSet(key, value){
  if(hasClaudeStorage){
    try{ return await window.storage.set(key, value); }

/* ---------- helpers de dados ---------- */
function deckById(id){ return state.decks.find(d=>d.id===id); }
function parseDeckList(text){
  if(!text) return [];
  const rows = text.split('\n').map(l=>l.trim()).filter(Boolean).map(line=>{
    line = line.replace(/^[-*•]\s*/, '');
    let m = line.match(/^(\d+)\s*[xX]?\s+(.+)$/);
    if(m) return {qty: parseInt(m[1],10), name: m[2].trim()};
    m = line.match(/^(.+?)\s*[xX]\s*(\d+)\)?$/);
    if(m) return {qty: parseInt(m[2],10), name: m[1].replace(/\(\s*$/,'').trim()};
    return {qty: 1, name: line};
  });
  // junta linhas repetidas da mesma carta, somando as quantidades
  const merged = {};
  const order = [];
  rows.forEach(r=>{
    const key = r.name.toLowerCase();
    if(!merged[key]){ merged[key] = {name: r.name, qty: 0}; order.push(key); }
    merged[key].qty += r.qty;
  });
  return order.map(k=>merged[k]);
}
function normalizeChanges(changes){
  if(!changes) return {outs:[], ins:[]};
  if(Array.isArray(changes)){
    return {
      outs: changes.map(c=>({name:c.out, qty:c.qty})),
      ins: changes.map(c=>({name:c.in, qty:c.qty}))
    };
  }
  return {outs: changes.outs||[], ins: changes.ins||[]};
}
function sbChangeCount(changes){
  const n = normalizeChanges(changes);
  return n.outs.length + n.ins.length;
}
function gamesLabel(m){
  if(m.gf==null && m.ga==null && m.gd==null) return '';
  const parts = [m.gf||0, m.ga||0];
  if(m.gd) parts.push(m.gd);
  return parts.join('-') + ' em jogos';
}
function deckLabel(deckId, fallback){
  const d = deckById(deckId);
  if(d) return d.name;
  if(fallback) return fallback;
  return 'Sem deck';
}
function allRounds(){
  const rows = [];
  state.tournaments.forEach(t=>{
    t.rounds.forEach(r=>{
      rows.push({...r, store:t.store, format:t.format, deckId:t.deckId, deckLabel:deckLabel(t.deckId, t.deck), source:'paper', tournamentId:t.id, date:t.date});
    });
  });
  return rows;
}
function allMatches(){
  return [...allRounds(), ...state.quickMatches.map(m=>({...m, deckLabel:deckLabel(m.deckId), source:'mtgo'}))];
}
function pct(w,total){ return total? Math.round((w/total)*100) : 0; }
function recordOf(list){
  const w = list.filter(m=>m.result==='W').length;
  const l = list.filter(m=>m.result==='L').length;
  const d = list.filter(m=>m.result==='D').length;
  return {w,l,d,total:list.length, pct: pct(w, w+l)};
}
function groupBy(list, key){
  const map = {};
  list.forEach(m=>{
    const k = m[key] || '—';
    (map[k] = map[k]||[]).push(m);
  });
  return map;
}
function activeTournament(){ return state.tournaments.find(t=>t.status==='open'); }
function knownStores(){ return [...new Set(state.tournaments.map(t=>t.store).filter(Boolean))]; }
function knownArchetypes(){
  const s = new Set();
  allMatches().forEach(m=> m.opponent && s.add(m.opponent));
  return [...s];
}

function computeLocalSummary(){
  const matches = allMatches();
  const overall = recordOf(matches);
  const byDeck = groupBy(matches, 'deckLabel');
  const decks = Object.entries(byDeck).map(([name,list])=>{
    const r = recordOf(list);
    const byArch = groupBy(list, 'opponent');
    const archetypes = Object.entries(byArch).map(([aname, alist])=>{
      const ar = recordOf(alist);
      const plan = computeSbPlan(alist);
      return {name:aname, w:ar.w, l:ar.l, d:ar.d, total:ar.total, pct:ar.pct, sb:{outs:plan.outs, ins:plan.ins}};
    }).sort((a,b)=> b.total-a.total);
    const localDeck = state.decks.find(dd=>dd.name===name);
    return {name, w:r.w, l:r.l, d:r.d, total:r.total, pct:r.pct, archetypes,
      main: localDeck ? localDeck.main : '', sb: localDeck ? localDeck.sb : ''};
  }).sort((a,b)=> b.total-a.total);
  return {w:overall.w, l:overall.l, d:overall.d, total:overall.total, pct:overall.pct, decks};
}

function exportBackup(){

    decks: state.decks,
    tournaments: state.tournaments,
    quickMatches: state.quickMatches,

function importBackup(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(){
    let data;
    try{ data = JSON.parse(reader.result); }
    catch(e){ showToast('Ficheiro inválido'); return; }
    if(!data || (!data.decks && !data.tournaments && !data.quickMatches)){
      showToast('Ficheiro não reconhecido');
      return;
    }
    showConfirm('Importar este ficheiro vai substituir todos os dados guardados neste dispositivo (decks, torneios, jogos MTGO). Continuar?', async function(){
      state.decks = data.decks || [];
      state.tournaments = data.tournaments || [];

      await saveTournaments();
      await saveQuick();
      if(data.teamPlayerName){

        await storageSet('teamPlayerName', teamName);
      }
      closeModal();
      render();
      showToast('Dados importados');
    }, 'Importar e substituir');
  };
  reader.readAsText(file);
}

function ringChart(pct, size, label){
  const s = size || 64;
  const stroke = Math.max(4, Math.round(s*0.11));
  const r = (s - stroke)/2;
  const c = 2*Math.PI*r;
  const dash = (pct/100) * c;
  return `
    <svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" style="flex-shrink:0;">
      <circle cx="${s/2}" cy="${s/2}" r="${r}" fill="none" stroke="var(--bg-alt)" stroke-width="${stroke}"/>
      <circle cx="${s/2}" cy="${s/2}" r="${r}" fill="none" stroke="var(--win)" stroke-width="${stroke}"
        stroke-linecap="round" stroke-dasharray="${dash} ${c}"
        transform="rotate(-90 ${s/2} ${s/2})"/>
      <text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle"
        font-family="Fraunces, serif" font-weight="600" font-size="${s*0.24}" fill="var(--ink)">${label!=null?label:pct+'%'}</text>
    </svg>
  `;
}

let sbGuideNav = {level:'decks', deck:null, archetype:null};
function setSbGuideView(level, deck, archetype){

/* ---------- plano de sideboard recomendado (baseado em vitórias/derrotas reais) ---------- */
function computeSbPlan(aMatches){
  function buildCandidates(kind){
    // agrupa por carta -> por quantidade usada -> registo V/D/E
    const byCard = {};
    aMatches.forEach(m=>{
      const n = normalizeChanges(m.changes);
      n[kind].forEach(c=>{
        const qty = Number(c.qty) || 1;
        if(!byCard[c.name]) byCard[c.name] = {};
        if(!byCard[c.name][qty]) byCard[c.name][qty] = {wins:0, losses:0, draws:0, total:0};
        const bucket = byCard[c.name][qty];
        bucket.total++;
        if(m.result==='W') bucket.wins++;
        else if(m.result==='L') bucket.losses++;
        else bucket.draws++;
      });
    });
    // para cada carta, escolhe a quantidade com melhor registo (nunca soma quantidades diferentes)
    const candidates = [];
    Object.entries(byCard).forEach(([name, qtyMap])=>{
      let best = null;
      Object.entries(qtyMap).forEach(([qtyStr, bucket])=>{
        const qty = Number(qtyStr);
        const net = bucket.wins - bucket.losses;
        if(!best || net>best.net || (net===best.net && bucket.total>best.total)){
          best = {qty, net, total:bucket.total, wins:bucket.wins, losses:bucket.losses, draws:bucket.draws};
        }
      });
      candidates.push({name, qty:best.qty, score:best.net, wins:best.wins, losses:best.losses, draws:best.draws, samples:best.total});
    });
    candidates.sort((a,b)=> b.score - a.score || b.samples - a.samples);
    return candidates;
  }
  let outs = buildCandidates('outs');
  let ins = buildCandidates('ins');
  const sumQty = (list)=> list.reduce((s,c)=>s+c.qty,0);
  const trimWorst = (list)=>{
    if(list.length===0) return;
    const worst = list[list.length-1];
    worst.qty -= 1;
    if(worst.qty<=0) list.pop();
  };
  let guard = 0;
  while(guard++ < 300){
    const so = sumQty(outs), si = sumQty(ins);
    if(so<=15 && si<=15 && so===si) break;
    if(outs.length===0 && ins.length===0) break;
    if(so>si) trimWorst(outs);
    else if(si>so) trimWorst(ins);
    else { trimWorst(outs); trimWorst(ins); }
  }
  return {outs, ins};
}
/* ---------- exportar guia de sideboard (folha imprimível/PDF) ---------- */
function exportSbGuide(deckName){
  const matches = allMatches().filter(m=> sbChangeCount(m.changes)>0 && m.deckLabel===deckName);
  const byArch = groupBy(matches, 'opponent');
  const archNames = Object.keys(byArch).sort((a,b)=> byArch[b].length - byArch[a].length);
  const dateStr = new Date().toLocaleDateString('pt-PT', {day:'2-digit', month:'long', year:'numeric'});

  let html = `
    <div class="exp-header">
      <div class="exp-title">Guia de Sideboard</div>
      <div class="exp-sub">${esc(deckName)} — Storm Crew · Pauper</div>
      <div class="exp-date">Gerado em ${dateStr}</div>
    </div>
  `;
  archNames.forEach(arch=>{
    const aMatches = byArch[arch];
    const {outs, ins} = computeSbPlan(aMatches);
    const total = outs.reduce((s,c)=>s+c.qty,0);
    html += `
      <div class="exp-arch">
        <div class="exp-arch-title">vs. ${esc(arch)} <span class="exp-arch-count">${total} carta${total===1?'':'s'} trocadas · ${aMatches.length} jogo${aMatches.length===1?'':'s'} registados</span></div>
        <div class="exp-cols">
          <div class="exp-col exp-col-out">
            <div class="exp-col-title">Sai do mainboard</div>
            ${outs.length? `<ul>${outs.map(o=>`<li><span class="exp-qty">${o.qty}x</span> ${esc(o.name)}</li>`).join('')}</ul>` : `<div class="exp-empty">Sem dados suficientes.</div>`}
          </div>
          <div class="exp-col exp-col-in">
            <div class="exp-col-title">Entra do sideboard</div>
            ${ins.length? `<ul>${ins.map(o=>`<li><span class="exp-qty">${o.qty}x</span> ${esc(o.name)}</li>`).join('')}</ul>` : `<div class="exp-empty">Sem dados suficientes.</div>`}
          </div>
        </div>
      </div>
    `;
  });
  document.getElementById('sb-export-sheet').innerHTML = html;
  window.print();
}

function viewSbGuide(){
  const matches = allMatches().filter(m=> sbChangeCount(m.changes) > 0);
  if(matches.length===0){
    return `

  const byDeck = groupBy(matches, 'deckLabel');

  // nível 3: guia para deck+arquétipo específico
  if(sbGuideNav.level==='detail' && byDeck[sbGuideNav.deck]){
    const aMatches = byDeck[sbGuideNav.deck].filter(m=>m.opponent===sbGuideNav.archetype);
    if(aMatches.length>0){
      const {outs, ins} = computeSbPlan(aMatches);

              </div>`).join('')}` : `<div class="fine">Sem cartas com registo suficiente para recomendar.</div>`}
            ${ins.length? `<div class="fine" style="margin:${outs.length?'10px':'0'} 0 4px;">Entra do sideboard:</div>${ins.map(r=>`
              <div class="change-row" style="align-items:flex-start;">

              </div>`).join('')}` : `<div class="fine">Sem cartas com registo suficiente para recomendar.</div>`}
          </div>
        </div>
      `;
    }
    sbGuideNav = {level:'archetypes', deck:sbGuideNav.deck, archetype:null};
  }

  // nível 2: arquétipos de um deck
  if(sbGuideNav.level==='archetypes' && byDeck[sbGuideNav.deck]){

let changesDraft = {outs:[], ins:[]};
let sbPickerDeckId = null;
let sbReturnMode = null; // 'round' | 'quick'
let roundModalTournamentId = null;
let roundDraft = {opponent:'', gf:'', ga:'', gd:''};
let quickDraft = {opponent:'', gf:'', ga:'', gd:'', date:'', note:'', deckId:''};

function sbSummaryHtml(){
  const outs = changesDraft.outs, ins = changesDraft.ins;
  if(outs.length===0 && ins.length===0){
    return `<div class="fine">Sem trocas de sideboard registadas para este jogo.</div>`;
  }
  const outsHtml = outs.map(o=>`
    <div class="change-row">
      <span class="qtytag">${o.qty}x</span>
      <span class="out">${esc(o.name)}</span>
      <button class="rm" onclick="removeSbEntry('outs','${jsAttr(o.name)}')">${ICON('x')}</button>
    </div>`).join('');
  const insHtml = ins.map(o=>`
    <div class="change-row">
      <span class="qtytag">${o.qty}x</span>
      <span class="in">${esc(o.name)}</span>
      <button class="rm" onclick="removeSbEntry('ins','${jsAttr(o.name)}')">${ICON('x')}</button>
    </div>`).join('');
  return `
    ${outs.length? `<div class="fine" style="margin-bottom:4px;">Sai do main:</div>${outsHtml}`:''}
    ${ins.length? `<div class="fine" style="margin:${outs.length?'10px':'0'} 0 4px;">Entra do sideboard:</div>${insHtml}`:''}
  `;
}
function refreshSbSummary(){
  const el = document.getElementById('sb-summary');
  if(el) el.innerHTML = sbSummaryHtml();
}
function removeSbEntry(kind, name){
  changesDraft[kind] = changesDraft[kind].filter(e=>e.name!==name);
  refreshSbSummary();
}
function changesBlockHtml(deckId, mode){
  const deck = deckById(deckId);
  const handler = mode==='quick' ? 'openSbPickerFromQuick()' : 'openSbPickerFromRound()';
  return `
    <label>Sideboard</label>
    <div id="sb-summary">${sbSummaryHtml()}</div>
    ${deck ? `<button type="button" class="btn-secondary" style="width:100%; margin-top:8px; display:flex; align-items:center; justify-content:center; gap:8px;" onclick="${handler}">${ICON('book')} Sideboard</button>`
      : `<div class="fine">Este deck ainda não tem lista guardada.</div>`}
  `;
}

function openSbPicker(deckId, mode){

  sbPickerDeckId = deckId;

}
function closeSbPicker(){
  if(sbReturnMode==='round') openModalNewRound(roundModalTournamentId, true);
  else if(sbReturnMode==='quick') openModalNewQuick(true);
  else closeModal();
}
function sbQtyFor(kind, name){
  const e = changesDraft[kind].find(x=>x.name===name);
  return e ? e.qty : 0;
}
function sbRow(kind, name, maxQty, rowId){
  const q = sbQtyFor(kind, name);
  return `
    <div class="round-row" style="padding:5px 0; margin:0;">
      <div class="opp" style="font-size:0.76rem; line-height:1.25;">${esc(name)}<br><span class="fine" style="font-size:0.62rem;">${maxQty}x no deck</span></div>
      <div style="display:flex; align-items:center; gap:5px; flex-shrink:0;">
        <button type="button" class="icon-btn" style="width:22px;height:22px;background:var(--bg-alt); font-size:0.8rem;" onclick="sbStep('${kind}','${jsAttr(name)}',-1,${maxQty},'${rowId}')">−</button>
        <span id="${rowId}" style="font-family:'IBM Plex Mono',monospace; font-size:0.78rem; min-width:12px; text-align:center;">${q}</span>
        <button type="button" class="icon-btn" style="width:22px;height:22px;background:var(--bg-alt); font-size:0.8rem;" onclick="sbStep('${kind}','${jsAttr(name)}',1,${maxQty},'${rowId}')">+</button>
      </div>
    </div>`;
}
function renderSbPickerModal(){
  const deck = deckById(sbPickerDeckId);
  const mainCards = deck ? parseDeckList(deck.main) : [];
  const sbCards = deck ? parseDeckList(deck.sb) : [];
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-bg">
      <div class="modal" style="padding-left:14px; padding-right:14px;">
        <button class="close-x" onclick="closeSbPicker()">&#10005;</button>
        <h3 style="font-size:1.02rem;">Sideboard — ${deck? esc(deck.name):''}</h3>
        <div class="fine" style="margin-bottom:8px; font-size:0.72rem;">Escolhe quantas cópias saem do mainboard e quantas entram do sideboard.</div>

        <div class="aname" style="font-size:0.82rem; margin-bottom:4px;">Retirar do mainboard</div>
        <div class="card" style="padding:2px 10px; margin-bottom:10px; max-height:180px; overflow-y:auto;">
          ${mainCards.length===0? `<div class="fine" style="padding:8px 0;">Sem mainboard guardado para este deck.</div>` :
            mainCards.map((c,i)=> sbRow('outs', c.name, c.qty, 'sbq-out-'+i)).join('')}
        </div>

        <div class="aname" style="font-size:0.82rem; margin-top:10px; margin-bottom:4px;">Adicionar do sideboard</div>
        <div class="card" style="padding:2px 10px; margin-bottom:10px; max-height:180px; overflow-y:auto;">
          ${sbCards.length===0? `<div class="fine" style="padding:8px 0;">Sem sideboard guardado para este deck.</div>` :
            sbCards.map((c,i)=> sbRow('ins', c.name, c.qty, 'sbq-in-'+i)).join('')}
        </div>

        <div class="modal-actions">
          <button class="btn-primary" style="width:100%" onclick="closeSbPicker()">Concluído</button>
        </div>
      </div>
    </div>
  `;
}
function sbStep(kind, name, delta, maxQty, rowId){
  const list = changesDraft[kind];
  let entry = list.find(e=>e.name===name);
  let q = entry ? entry.qty : 0;
  q = Math.max(0, Math.min(maxQty, q+delta));
  if(q===0){ if(entry) list.splice(list.indexOf(entry),1); }
  else if(entry){ entry.qty = q; }
  else { list.push({name, qty:q}); }
  const span = document.getElementById(rowId);
  if(span) span.textContent = q;
}

}
function submitNewRound(tournamentId, round){
  const opponent = document.getElementById('r-opp').value.trim();
  if(!opponent){ document.getElementById('r-opp').focus(); return; }
  const gfRaw = document.getElementById('r-gf').value;
  const gaRaw = document.getElementById('r-ga').value;
  const gdRaw = document.getElementById('r-gd').value;
  const t = state.tournaments.find(x=>x.id===tournamentId);
  t.rounds.push({
    id: uid(), round, opponent, result: roundResultPick,
    gf: gfRaw===''? null : Number(gfRaw),
    ga: gaRaw===''? null : Number(gaRaw),
    gd: gdRaw===''? null : Number(gdRaw),
    changes: {outs:[...changesDraft.outs], ins:[...changesDraft.ins]}
  });
  saveTournaments();
  changesDraft = {outs:[], ins:[]};
  roundDraft = {opponent:'', gf:'', ga:'', gd:''};
  closeModal();
  render();
  showToast('Ronda guardada');
}
function removeRound(tournamentId, roundId){
  const t = state.tournaments.find(x=>x.id===tournamentId);

  render();
  showToast('Ronda removida');
}

  showConfirm('Remover este torneio e todas as rondas registadas nele? Esta ação não pode ser desfeita.', function(){

    saveTournaments();
    render();
    showToast('Torneio removido');
  }, 'Remover');
}
function closeTournament(tournamentId){
  const t = state.tournaments.find(x=>x.id===tournamentId);
  const finish = function(){
    t.status = 'closed';
    saveTournaments();
    render();
    showToast('Torneio fechado');
  };
  if(t.rounds.length===0){
    showConfirm('Este torneio ainda não tem rondas registadas. Fechar mesmo assim?', finish, 'Fechar');
  } else {
    finish();
  }
}

/* ---------- deteção de versão desatualizada (ícones instalados ficam por vezes em cache) ---------- */
const APP_BUILD = '2026-09-02-6';
(function checkForUpdate(){
  try{
    fetch(location.pathname, {cache:'no-store'})
      .then(function(r){ return r.text(); })
      .then(function(html){
        const m = html.match(/APP_BUILD:([\w.-]+)/);
        if(m && m[1] !== APP_BUILD){
          location.href = location.pathname + '?v=' + Date.now();
        }
      })
      .catch(function(){ /* offline ou sem acesso — ignora */ });
  }catch(e){}
})();
</script>
